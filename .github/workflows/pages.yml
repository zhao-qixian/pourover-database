name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare lightweight Pages package
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path('site').resolve()
          destination = Path('_pages')
          destination.mkdir()
          manifest = json.loads((source / 'publication.json').read_text())
          for name, expected in manifest['files'].items():
              if name.startswith('media/'):
                  continue
              if Path(name).is_absolute() or '..' in Path(name).parts:
                  raise ValueError('Invalid public file: ' + name)
              original = (source / name).resolve()
              if not original.is_relative_to(source) or original.is_symlink():
                  raise ValueError('Invalid public file: ' + name)
              if hashlib.sha256(original.read_bytes()).hexdigest() != expected:
                  raise ValueError('Public file checksum mismatch: ' + name)
              target = destination / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(original, target)
          manifest['media_base'] = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['GITHUB_SHA'] + '/site/'
          manifest['remote_media'] = {k: v for k, v in manifest['files'].items() if k.startswith('media/')}
          manifest['files'] = {k: v for k, v in manifest['files'].items() if not k.startswith('media/')}
          (destination / 'publication.json').write_text(json.dumps(manifest, ensure_ascii=False), encoding='utf-8')
          (destination / '.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pages
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
