name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare lightweight Pages package
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path('site').resolve()
          destination = Path('_pages')
          destination.mkdir()
          manifest = json.loads((source / 'publication.json').read_text())
          for name, expected in manifest['files'].items():
              if name.startswith('media/'):
                  continue
              if Path(name).is_absolute() or '..' in Path(name).parts:
                  raise ValueError('Invalid public file: ' + name)
              original = (source / name).resolve()
              if not original.is_relative_to(source) or original.is_symlink():
                  raise ValueError('Invalid public file: ' + name)
              if hashlib.sha256(original.read_bytes()).hexdigest() != expected:
                  raise ValueError('Public file checksum mismatch: ' + name)
              target = destination / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(original, target)
          manifest['media_base'] = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['GITHUB_SHA'] + '/site/'
          manifest.pop('files', None)
          (destination / 'publication.json').write_text(json.dumps(manifest, ensure_ascii=False), encoding='utf-8')
          (destination / '.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pages
      - name: Deploy verified artifact by ID
        uses: actions/github-script@v7
        id: deployment
        timeout-minutes: 15
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Missing uploaded artifact ID');
            const args = {...context.repo, request: {timeout: 30000}};
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const transient = error => [404, 429, 500, 502, 503, 504].includes(error.status) || !error.status;
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                artifact = (await github.request('GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {...args, artifact_id: artifactId})).data;
                break;
              } catch (error) {
                if (!transient(error) || attempt === 11) throw new Error('Uploaded artifact is not readable: HTTP ' + (error.status || 'network'));
                core.info('Waiting for uploaded artifact metadata...');
                await sleep(5000);
              }
            }
            if (artifact.name !== process.env.PAGES_ARTIFACT_NAME || artifact.expired || Number(artifact.workflow_run?.id) !== context.runId) {
              throw new Error('Uploaded artifact does not match this workflow run');
            }
            core.info('Verified uploaded artifact ID ' + artifactId);
            const token = await core.getIDToken();
            core.setSecret(token);
            // Do not retry an ambiguous creation failure: it may have created a deployment.
            let deployment;
            try {
              deployment = (await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...args, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: token
              })).data;
            } catch (error) {
              throw new Error('Pages deployment creation failed: HTTP ' + (error.status || 'network'));
            }
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Missing Pages deployment ID');
            core.setOutput('page_url', deployment.page_url);
            const deadline = Date.now() + 600000;
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            while (Date.now() < deadline) {
              await sleep(5000);
              let state;
              try {
                state = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {...args, deployment_id: deploymentId})).data.status;
              } catch (error) {
                if (transient(error)) continue;
                throw new Error('Pages status request failed: HTTP ' + error.status);
              }
              core.info('Pages deployment: ' + state);
              if (state === 'succeed') return;
              if (failed.has(state)) throw new Error('Pages deployment failed: ' + state);
            }
            try { await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {...args, deployment_id: deploymentId}); } catch {}
            throw new Error('Pages deployment timed out');
